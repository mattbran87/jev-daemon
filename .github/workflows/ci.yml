name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run that is still going.
# On main, each commit gets its own group, so no run cancels another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash on every runner, so a failing command in a multi-line step fails the step on Windows too.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # CI pins its toolchain, so a new Rust release cannot add a lint that fails a commit that passed.
  RUST_VERSION: "1.99.1"
  # The workspace's rust-version. The shipped code must build with it; the tests need a newer Rust.
  MSRV: "1.85"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS support is Apple Silicon only; macos-14 is an Apple Silicon runner.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the jev-tray build packages
        # jev-tray's tray library needs GTK 3 and an AppIndicator library on Linux.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    # The MSRV value lives in env.MSRV and in the workspace rust-version.
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the jev-tray build packages
        # jev-tray's tray library needs GTK 3 and an AppIndicator library on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Check
        # No --all-targets: wiremock, a test-only dependency, needs Rust 1.88.
        run: cargo check --workspace --locked

  mod:
    name: mod (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # Claude Code 2.1.300 needs Node 22 or later.
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/claude-code
      - name: The mod's tests
        run: claude plugin test plugins/claude-code

  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        # A new advisory appears with no change in this repo, so on a pull request its failure
        # does not fail the job. advisories.yml runs it every day and fails there; on main it fails here.
        continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
        with:
          command: check ${{ matrix.checks }}
