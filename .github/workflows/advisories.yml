name: advisories

# A new RUSTSEC advisory appears with no change in this repo. This daily run fails when one does,
# so someone sees it, and no pull request turns red for it.
# GitHub turns off a scheduled workflow after 60 days with no repo activity.
# Failure mail goes to whoever last changed the cron line.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check advisories
