[workspace]
resolver = "3"
members = ["crates/jev-proto", "crates/jevd", "crates/jev", "crates/jev-tray"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/mattbran87/jev-daemon"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
