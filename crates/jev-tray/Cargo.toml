[package]
name = "jev-tray"
description = "A tray icon that shows whether jevd runs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# jev-tray is its own dist app, with its own archives. On Linux, it needs GTK 3
# to build, and it loads the AppIndicator library at run time.
[package.metadata.dist.dependencies.apt]
libgtk-3-dev = "*"
libayatana-appindicator3-dev = "*"

[dependencies]
jev-proto = { version = "0.1.0", path = "../jev-proto" }
png = "0.18"
# tray-icon 0.25 and later need Rust 1.90; the workspace MSRV is 1.85.
tao = { version = "0.37.1", default-features = false }
# "gtk" gives the menu on Linux; the default "libxdo" is left out.
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
jevd = { version = "0.1.0", path = "../jevd" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
