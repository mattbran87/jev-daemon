# cargo-deny: licenses, security advisories, and sources (spec section 8).
# CI runs `cargo deny check` on each push and pull request.

[graph]
# The release targets only, so a crate that only another platform uses does not count.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory needs a reason here.
ignore = [
    # zvariant, zbus_names, and zvariant_derive: "unmaintained" notices, not
    # vulnerabilities (2026-10-17). They reach us on Linux only: keyring 3.6 ->
    # secret-service 4 -> zbus 4. The fix is zbus 6, which keyring 3.6 does not
    # use, and keyring 4 needs Rust 1.88, above the 1.85 MSRV. Look again when
    # the MSRV moves.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via keyring 3.6, Linux only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via keyring 3.6, Linux only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via keyring 3.6, Linux only" },
    # proc-macro-error: an "unmaintained" notice, not a vulnerability. It is a
    # build-time macro crate that reaches us on Linux only: jev-tray ->
    # tray-icon 0.24 and tao -> gtk 0.18 -> glib-macros 0.18. tray-icon 0.25
    # and later need Rust 1.90, above the 1.85 MSRV. Look again when the MSRV
    # moves.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; via gtk 0.18 for jev-tray, Linux only, build time" },
]

[licenses]
version = 2
# Every license in the tree on 2026-11-04. A new one fails CI until someone adds it here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
# option-ext: MPL-2.0, a file-level copyleft. We use it unmodified, so it puts
# no terms on our code. It reaches us on Linux only: jev-tray -> tray-icon 0.24
# -> dirs 6 -> dirs-sys -> option-ext. Look again when the MSRV allows
# tray-icon 0.25.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
# Two versions of one crate (windows-sys, for example) are common and not a defect.
multiple-versions = "warn"
# The binaries use rustls and must not pull in OpenSSL.
deny = [{ name = "openssl-sys" }, { name = "openssl" }]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
